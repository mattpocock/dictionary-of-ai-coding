name: README freshness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck generator
        run: npx tsc -p internal/tsconfig.json
      - name: Regenerate READMEs
        run: npm run generate
      - name: Fail if generated READMEs are out of sync
        run: |
          if ! git diff --exit-code -- README.md README.zh-CN.md; then
            echo "Generated READMEs are out of sync with dictionary sources, curriculums, or templates."
            echo "Run: npm run generate && commit the result."
            exit 1
          fi
